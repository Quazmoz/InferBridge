name: Repair InferBridge validation

on:
  push:
    branches: ["rename/inferbridge"]
    paths: [".github/workflows/inferbridge-validation-repair.yml"]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/inferbridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Format transition changes
        run: |
          ruff check . --fix
          ruff format .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: format InferBridge transition validation"
            git push origin HEAD:rename/inferbridge
          fi
      - name: Validate complete migration
        env:
          OV_LLM_MOCK: "true"
        run: |
          ruff check .
          ruff format --check .
          python -m py_compile \
            app/brand.py \
            app/paths.py \
            app/startup_registration.py \
            app/release_models.py \
            app/update_checker.py \
            app/distribution.py \
            scripts/release_manifest.py \
            scripts/release_scan.py \
            scripts/verify_release_signing.py \
            scripts/verify_release_provenance.py
          pytest
          pytest \
            tests/test_inferbridge_brand.py \
            tests/test_inferbridge_paths.py \
            tests/test_inferbridge_startup.py \
            tests/test_inferbridge_update_compatibility.py \
            tests/test_inferbridge_packaging_contract.py \
            tests/test_inferbridge_release_repository.py \
            tests/test_release_pipeline.py \
            tests/test_release_signing_gate.py \
            tests/test_release_provenance.py \
            tests/test_installer_upgrade_contract.py \
            tests/test_update_checker.py \
            tests/test_update_checker_resilience.py \
            tests/test_release_models.py
      - name: Remove one-time validation workflows
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/inferbridge-transition-polish.yml
          rm -f .github/workflows/inferbridge-validation-repair.yml
          git add -A
          git commit -m "chore: remove InferBridge validation bootstrap"
          git push origin HEAD:rename/inferbridge
