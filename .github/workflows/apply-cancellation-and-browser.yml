name: Apply Cancellation And Browser Integration

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/apply-cancellation-and-browser.yml"

concurrency:
  group: apply-cancellation-browser-development
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout development
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply integration patches
        run: |
          python .github/scripts/apply_cancellation_and_browser.py
          python .github/scripts/fix_cancellation_race.py
          python .github/scripts/fix_browser_imports.py

      - name: Install test and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,browser]
          python -m playwright install --with-deps chromium

      - name: Format and lint implementation
        run: |
          ruff format \
            app/config.py \
            app/model_cancellation.py \
            app/cancellation_ui.py \
            browser_tests/conftest.py \
            browser_tests/test_progress_browser.py \
            tests/test_model_cancellation.py \
            tests/test_model_cancellation_race.py \
            tests/test_cancellation_ui.py
          ruff check \
            app/config.py \
            app/model_cancellation.py \
            app/cancellation_ui.py \
            browser_tests/conftest.py \
            browser_tests/test_progress_browser.py \
            tests/test_model_cancellation.py \
            tests/test_model_cancellation_race.py \
            tests/test_cancellation_ui.py

      - name: Validate embedded browser scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.cancellation_ui import CANCELLATION_UI_JS
          from app.progress_operation_ui import PROGRESS_OPERATION_JS
          from app.progress_reliability import PROGRESS_RELIABILITY_JS

          scripts = {
              'cancellation': CANCELLATION_UI_JS,
              'operation': PROGRESS_OPERATION_JS,
              'progress': PROGRESS_RELIABILITY_JS,
          }
          for name, source in scripts.items():
              Path(f'/tmp/{name}.js').write_text(source, encoding='utf-8')
          PY
          node --check /tmp/cancellation.js
          node --check /tmp/operation.js
          node --check /tmp/progress.js

      - name: Run focused Python regressions
        env:
          OV_LLM_MOCK: "true"
        run: >-
          pytest
          tests/test_model_cancellation.py
          tests/test_model_cancellation_race.py
          tests/test_cancellation_ui.py
          tests/test_structured_progress.py
          tests/test_progress_operation_ui.py
          tests/test_progress_reliability.py
          tests/test_progress_ui.py
          tests/test_conversion_cancellation.py
          tests/test_conversion_stream_safety.py
          tests/test_server_mock.py

      - name: Run real Chromium behavior tests
        env:
          OV_LLM_MOCK: "true"
          INFERBRIDGE_BROWSER_ARTIFACTS: browser-artifacts
        run: pytest browser_tests -q

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cancellation-browser-integration-diagnostics
          path: browser-artifacts
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit validated integration
        if: success()
        run: |
          rm .github/scripts/apply_cancellation_and_browser.py
          rm .github/scripts/fix_cancellation_race.py
          rm .github/scripts/fix_browser_imports.py
          rm .github/workflows/apply-cancellation-and-browser.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add -A
          git commit -m "feat: add cancellable model operations and browser tests"
          git push origin HEAD:development
