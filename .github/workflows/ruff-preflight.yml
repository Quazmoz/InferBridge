name: Ruff preflight

# Catch style drift on dev pushes/PRs before a manually queued Azure Windows build.
# This gate intentionally installs no OpenVINO/release runtime dependencies.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff from the release requirements
        shell: bash
        run: |
          set -euo pipefail
          # One formatter version for local development, Azure and this fast gate.
          pin="$(grep '^ruff==' requirements/release.txt)"
          test -n "$pin"
          python -m pip install --disable-pip-version-check --no-deps "$pin"
      - name: Check lint and repository-wide formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
