name: Diagnose Split Status Python 3.13

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/diagnose-status-split-py313.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Capture Python 3.13 output
        shell: bash
        env:
          OV_LLM_MOCK: "true"
        run: |
          set +e
          ruff check . > /tmp/ruff-check.txt 2>&1
          ruff_check=$?
          ruff format --check . > /tmp/ruff-format.txt 2>&1
          ruff_format=$?
          pytest > /tmp/pytest.txt 2>&1
          pytest_status=$?
          set -e

          mkdir -p .audit
          {
            echo "validated_sha=${GITHUB_SHA}"
            echo "ruff_check=${ruff_check}"
            echo "ruff_format=${ruff_format}"
            echo "pytest=${pytest_status}"
            echo "--- ruff check ---"
            tail -160 /tmp/ruff-check.txt
            echo "--- ruff format ---"
            tail -160 /tmp/ruff-format.txt
            echo "--- pytest ---"
            tail -500 /tmp/pytest.txt
          } > .audit/status-split-py313.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add .audit/status-split-py313.txt
          git commit -m "[skip ci] ci: record Python 3.13 split status diagnostic"
          git push origin HEAD:development
