name: Validate Final Chromium Behavior

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/validate-browser-final.yml"

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,browser]
          python -m playwright install --with-deps chromium
      - name: Validate browser test source
        run: |
          ruff check browser_tests
          ruff format --check browser_tests
      - name: Run Chromium suite three times
        env:
          OV_LLM_MOCK: "true"
          INFERBRIDGE_BROWSER_ARTIFACTS: browser-artifacts
        run: |
          pytest browser_tests -q
          pytest browser_tests -q
          pytest browser_tests -q
      - name: Record success
        run: |
          mkdir -p .audit
          cat > .audit/browser-final.txt <<EOF
          validated_sha=${GITHUB_SHA}
          browser=success
          repetitions=3
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add .audit/browser-final.txt
          git commit -m "[skip ci] ci: record final Chromium validation"
          git push origin HEAD:development
