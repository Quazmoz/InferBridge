name: Validate Final Chromium Behavior

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/validate-browser-final.yml"

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,browser]
          python -m playwright install --with-deps chromium
      - name: Capture repeated Chromium validation
        shell: bash
        env:
          OV_LLM_MOCK: "true"
          INFERBRIDGE_BROWSER_ARTIFACTS: browser-artifacts
        run: |
          set +e
          ruff check browser_tests > /tmp/ruff-check.txt 2>&1
          ruff_check=$?
          ruff format --check browser_tests > /tmp/ruff-format.txt 2>&1
          ruff_format=$?
          : > /tmp/browser.txt
          browser_status=0
          for run in 1 2 3; do
            echo "--- repetition ${run} ---" >> /tmp/browser.txt
            pytest browser_tests -q --basetemp=".browser-tmp-${run}" >> /tmp/browser.txt 2>&1
            status=$?
            if [ "${status}" -ne 0 ]; then
              browser_status=${status}
            fi
          done
          set -e
          mkdir -p .audit
          {
            echo "validated_sha=${GITHUB_SHA}"
            echo "ruff_check=${ruff_check}"
            echo "ruff_format=${ruff_format}"
            echo "browser=${browser_status}"
            echo "repetitions=3"
            echo "--- ruff check ---"
            cat /tmp/ruff-check.txt
            echo "--- ruff format ---"
            cat /tmp/ruff-format.txt
            echo "--- browser ---"
            tail -320 /tmp/browser.txt
          } > .audit/browser-final.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add .audit/browser-final.txt
          git commit -m "[skip ci] ci: record final Chromium validation"
          git push origin HEAD:development
