name: Finalize InferBridge post-rename migration

on:
  push:
    branches: ["rename/inferbridge"]
    paths: [".github/workflows/inferbridge-post-rename-finalize.yml"]

permissions:
  contents: write

concurrency:
  group: inferbridge-post-rename-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OV_LLM_MOCK: "true"
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: rename/inferbridge
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply idempotent final migration cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace_if_present(path: str, old: str, new: str) -> None:
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new))

          # Public embedded UI branding. Use placeholders where Python constants
          # should remain authoritative without retaining the legacy display literal.
          release_ui = read("app/release_ui.py")
          if "from app.brand import DISPLAY_NAME" not in release_ui:
              marker = '"""Dependency-free About and Updates UI extension."""\n\n'
              release_ui = release_ui.replace(
                  marker,
                  marker + "from app.brand import DISPLAY_NAME\n\n",
                  1,
              )
          release_ui = release_ui.replace(
              "OpenVINO Windows LLM", "__INFERBRIDGE_DISPLAY_NAME__"
          )
          if "__INFERBRIDGE_DISPLAY_NAME__" in release_ui and (
              "RELEASE_EXTENSION_JS = RELEASE_EXTENSION_JS.replace" not in release_ui
          ):
              release_ui += (
                  '\nRELEASE_EXTENSION_JS = RELEASE_EXTENSION_JS.replace('
                  '"__INFERBRIDGE_DISPLAY_NAME__", DISPLAY_NAME)\n'
              )
          write("app/release_ui.py", release_ui)

          onboarding = read("app/onboarding_ui.py")
          if "from app.brand import DISPLAY_NAME" not in onboarding:
              onboarding = onboarding.replace(
                  "from app import ui_extension\n",
                  "from app import ui_extension\nfrom app.brand import DISPLAY_NAME\n"
                  "from app.version import __version__\n",
                  1,
              )
          onboarding = onboarding.replace(
              "OpenVINO Windows LLM", "__INFERBRIDGE_DISPLAY_NAME__"
          ).replace("Version 0.3.0", "Version __INFERBRIDGE_VERSION__")
          if "ONBOARDING_UI = ONBOARDING_UI.replace" not in onboarding:
              onboarding += (
                  '\nONBOARDING_UI = ONBOARDING_UI.replace('
                  '"__INFERBRIDGE_DISPLAY_NAME__", DISPLAY_NAME).replace('
                  '"__INFERBRIDGE_VERSION__", __version__)\n'
              )
          write("app/onboarding_ui.py", onboarding)

          for path in ("app/ui_quality.py", "app/ui_polish.py", "app/doctor_ui.py"):
              text = read(path)
              text = text.replace("OpenVINO Windows LLM", "InferBridge")
              text = text.replace("OpenVINO LLM process", "InferBridge process")
              write(path, text)

          web = read("web/index.html")
          web = web.replace("<title>OpenVINO LLM</title>", "<title>InferBridge</title>")
          web = web.replace(">OpenVINO LLM<", ">InferBridge<")
          web = web.replace(">OpenVINO GenAI<", ">Local AI for Intel hardware<")
          write("web/index.html", web)

          current_files = (
              "setup.bat",
              "setup.sh",
              "start_server.bat",
              "setup/linux/install_deps.sh",
              "setup/windows/setup_all.ps1",
              "QUICKSTART.md",
              "CONTRIBUTING.md",
              "OPENWEBUI.md",
              "docs/TRAY.md",
              "docs/PORTABLE.md",
              "docs/INSTALLER.md",
              "docs/DATA_PATHS.md",
              "docs/UPGRADE_ROLLBACK.md",
              "docs/DESKTOP_ARCHITECTURE.md",
              "docs/TROUBLESHOOTING_DESKTOP.md",
              "docs/UPDATE_POLICY.md",
              "docs/RELEASE_PROCESS.md",
              "docs/DIAGNOSTICS.md",
              "docs/MODEL_LIBRARY.md",
              "docs/VISION.md",
          )
          for path in current_files:
              target = ROOT / path
              if not target.is_file():
                  continue
              text = target.read_text(encoding="utf-8")
              text = text.replace("OpenVINO Windows LLM", "InferBridge")
              text = text.replace("OpenVINO LLM server", "InferBridge server")
              target.write_text(text, encoding="utf-8")

          replace_if_present(
              "CONTRIBUTING.md",
              "git clone https://github.com/<your-username>/openvino-windows-llm.git",
              "git clone https://github.com/<your-username>/InferBridge.git",
          )
          replace_if_present(
              "README.md",
              "**Current development version: `0.7.0`.** This branch rebrands the product as InferBridge",
              "**Current development version: `0.7.0`.** Version 0.7.0 rebrands the product as InferBridge",
          )

          release_manifest = read("scripts/release_manifest.py")
          if "from app.brand import LEGACY_REPOSITORY_NAME" not in release_manifest:
              release_manifest = release_manifest.replace(
                  "from app.build_info import BuildInfo\n",
                  "from app.brand import LEGACY_REPOSITORY_NAME, REPOSITORY_NAME, REPOSITORY_OWNER\n"
                  "from app.build_info import BuildInfo\n",
                  1,
              )
          release_manifest = release_manifest.replace(
              '_ALLOWED_RELEASE_REPOSITORIES = {\n    "Quazmoz/openvino-windows-llm",\n'
              '    "Quazmoz/InferBridge",\n}\n',
              '_ALLOWED_RELEASE_REPOSITORIES = {\n'
              '    f"{REPOSITORY_OWNER}/{REPOSITORY_NAME}",\n'
              '    f"{REPOSITORY_OWNER}/{LEGACY_REPOSITORY_NAME}",\n}\n'
              '_DEFAULT_RELEASE_REPOSITORY = f"{REPOSITORY_OWNER}/{REPOSITORY_NAME}"\n',
          )
          release_manifest = release_manifest.replace(
              '    selected = configured or automatic or "Quazmoz/openvino-windows-llm"\n',
              '    selected = configured or automatic or _DEFAULT_RELEASE_REPOSITORY\n',
          )
          write("scripts/release_manifest.py", release_manifest)

          replace_if_present(
              "app/update_checker.py",
              "    for repository in (LEGACY_REPOSITORY_NAME, REPOSITORY_NAME)\n",
              "    for repository in (REPOSITORY_NAME, LEGACY_REPOSITORY_NAME)\n",
          )

          startup = read("app/startup_registration.py").splitlines()
          startup = [
              '    location: str = f"HKCU\\\\{RUN_KEY}\\\\{CURRENT_VALUE_NAME}"'
              if "location: str =" in line
              else line
              for line in startup
          ]
          write("app/startup_registration.py", "\n".join(startup) + "\n")

          write(
              "docs/INFERBRIDGE_MIGRATION.md",
              '''# InferBridge migration and repository-rename plan

## Product positioning

**InferBridge** is local AI for Intel hardware: a Windows-first local AI server with an OpenAI-compatible API, powered by OpenVINO GenAI.

OpenVINO remains the inference runtime and dependency. InferBridge does not replace or own OpenVINO and does not claim affiliation with Intel.

## Repository rename status

The repository was renamed to `Quazmoz/InferBridge` on July 30, 2026. GitHub retained the repository identity, history, branches, issues, releases, tags, and stars.

No compatibility-aware public release was published before the slug changed. Older installations that predate InferBridge-aware update discovery may require one manual installer upgrade if GitHub's legacy releases API or embedded release URLs do not redirect reliably. InferBridge 0.7.0 and later accept both the canonical and legacy repository release locations, manifest names, and artifact prefixes.

Do not create a replacement repository at `Quazmoz/openvino-windows-llm`; the old path must remain available as GitHub's redirect.

## Installer behavior

- Preserve `AppId={{F94A3938-C943-4E6D-B482-852D4AAE06F8}` exactly.
- New installs default to `%LOCALAPPDATA%\\Programs\\InferBridge`.
- Existing installs may retain their previous install directory through the preserved `AppId` and `UsePreviousAppDir=yes`.
- Upgrade cleanup recognizes `InferBridge.exe` and `OpenVINOWindowsLLM.exe` and removes legacy executable and shortcut remnants.
- Uninstall preserves mutable data by default. Explicit removal deletes only the exact InferBridge and legacy application-data directories.

## Data-directory selection

1. `OV_LLM_DATA_DIR` remains the highest-priority override.
2. Portable mode continues using `<portable root>\\data`.
3. Installed mode uses `%LOCALAPPDATA%\\InferBridge` when that directory already exists.
4. If the new directory does not exist and `%LOCALAPPDATA%\\OpenVINOWindowsLLM` exists, the legacy directory remains active.
5. A clean install uses `%LOCALAPPDATA%\\InferBridge`.
6. No automatic multi-gigabyte move or merge occurs.
7. If both directories contain data, InferBridge is selected and a privacy-safe warning is emitted.

## Start with Windows

InferBridge uses the registry value name `InferBridge`. A recognized enabled `OpenVINOWindowsLLM` value that points to the previous executable is migrated to the new value and command. Disabled users remain disabled, portable mode remains ineligible, and unrelated registry values are untouched.

## Post-rename verification

The GitHub connector confirms the canonical repository is `Quazmoz/InferBridge` and the old repository identifier resolves to the renamed repository. Before publishing 0.7.0, verify clone, fetch, push, old web and Git redirects, the legacy REST releases endpoint, manifest and checksum downloads, and release-asset redirects from a real network environment.

## Release repository selection

Release manifests now default to `Quazmoz/InferBridge`. GitHub Actions also resolves the canonical repository through `GITHUB_REPOSITORY`. `OV_LLM_RELEASE_REPOSITORY` remains a restricted transition override that accepts only `Quazmoz/InferBridge` or `Quazmoz/openvino-windows-llm` for compatibility testing and historical release verification.
''',
          )

          write(
              "tests/test_inferbridge_release_repository.py",
              '''import pytest

from scripts.release_manifest import release_repository


def test_release_repository_defaults_to_canonical_after_rename():
    assert release_repository({}) == "Quazmoz/InferBridge"


def test_release_repository_uses_renamed_github_repository():
    assert release_repository({"GITHUB_REPOSITORY": "Quazmoz/InferBridge"}) == "Quazmoz/InferBridge"


def test_release_repository_allows_explicit_legacy_transition_override():
    assert (
        release_repository({"OV_LLM_RELEASE_REPOSITORY": "Quazmoz/openvino-windows-llm"})
        == "Quazmoz/openvino-windows-llm"
    )


def test_release_repository_rejects_lookalike_repository():
    with pytest.raises(ValueError):
        release_repository({"OV_LLM_RELEASE_REPOSITORY": "Quazmoz/InferBridge-malicious"})
''',
          )

          update_tests = read("tests/test_update_checker.py")
          if "from app.brand import USER_AGENT_PRODUCT" not in update_tests:
              update_tests = update_tests.replace(
                  "from app.release_models import artifact_filename\n",
                  "from app.brand import USER_AGENT_PRODUCT\n"
                  "from app.release_models import artifact_filename\n"
                  "from app.version import __version__\n",
                  1,
              )
          update_tests = update_tests.replace(
              '        "OpenVINO-Windows-LLM/0.6.3" in headers.get("User-agent", "")\n',
              '        f"{USER_AGENT_PRODUCT}/{__version__}" in headers.get("User-agent", "")\n',
          )
          write("tests/test_update_checker.py", update_tests)

          compatibility_tests = read("tests/test_inferbridge_update_compatibility.py")
          compatibility_tests = compatibility_tests.replace(
              "from app.update_checker import _candidate_manifest_url\n",
              "from app.update_checker import _RELEASES_APIS, _candidate_manifest_url\n",
          )
          if "test_canonical_release_api_is_checked_before_legacy_fallback" not in compatibility_tests:
              compatibility_tests += (
                  '\n\ndef test_canonical_release_api_is_checked_before_legacy_fallback():\n'
                  '    assert "/Quazmoz/InferBridge/releases" in _RELEASES_APIS[0]\n'
                  '    assert "/Quazmoz/openvino-windows-llm/releases" in _RELEASES_APIS[1]\n'
              )
          write("tests/test_inferbridge_update_compatibility.py", compatibility_tests)
          PY

          rm -f \
            .github/scripts/finalize_inferbridge_core.py \
            .github/scripts/finalize_inferbridge_ui.py \
            .github/scripts/write_inferbridge_final_tests.py \
            .github/workflows/inferbridge-public-branding-finalize.yml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Format and validate complete migration
        run: |
          ruff check . --fix
          ruff format .
          ruff check .
          ruff format --check .
          python -m py_compile \
            app/brand.py \
            app/desktop_launcher.py \
            app/diagnostics.py \
            app/paths.py \
            app/release_models.py \
            app/server.py \
            app/startup_registration.py \
            app/update_checker.py \
            packaging/runtime_hook.py \
            scripts/release_manifest.py \
            scripts/release_scan.py \
            scripts/verify_release_signing.py \
            scripts/verify_release_provenance.py
          python scripts/release_tools.py verify-version-consistency --root . --version 0.7.0
          pytest

      - name: Commit validated final state and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/inferbridge-post-rename-finalize.yml
          if [ -d .github/scripts ] && [ -z "$(find .github/scripts -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            rmdir .github/scripts
          fi
          git add -A
          git commit -m "fix: finalize InferBridge repository rename"
          git push origin HEAD:rename/inferbridge
