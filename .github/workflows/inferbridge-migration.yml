name: Complete InferBridge migration

on:
  push:
    branches: ["rename/inferbridge"]
    paths:
      - ".github/workflows/inferbridge-migration.yml"

permissions:
  contents: write

concurrency:
  group: inferbridge-migration
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/inferbridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply docs and tests, validate, and clean bootstrap
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/inferbridge-completion.log) 2>&1
          record_failure() {
            status=$?
            if [ "$status" -eq 0 ]; then return; fi
            git reset --hard HEAD
            cp /tmp/inferbridge-completion.log .github/inferbridge-migration-failure.log
            git add .github/inferbridge-migration-failure.log
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: record InferBridge migration failure" || true
            git push origin HEAD:rename/inferbridge || true
            exit "$status"
          }
          trap record_failure EXIT
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python .github/scripts/apply_inferbridge_migration.py --stage docs-tests
          git add -A
          git commit -m "docs: document and test InferBridge migration"
          git push origin HEAD:rename/inferbridge

          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          ruff check . --fix
          ruff format .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: format InferBridge migration"
            git push origin HEAD:rename/inferbridge
          fi
          ruff check .
          ruff format --check .
          OV_LLM_MOCK=true pytest
          OV_LLM_MOCK=true pytest \
            tests/test_inferbridge_brand.py \
            tests/test_inferbridge_paths.py \
            tests/test_inferbridge_startup.py \
            tests/test_inferbridge_update_compatibility.py \
            tests/test_inferbridge_packaging_contract.py \
            tests/test_release_pipeline.py \
            tests/test_release_signing_gate.py \
            tests/test_release_provenance.py \
            tests/test_installer_upgrade_contract.py \
            tests/test_update_checker.py \
            tests/test_update_checker_resilience.py \
            tests/test_release_models.py

          rm .github/scripts/apply_inferbridge_migration.py
          rm .github/workflows/inferbridge-migration.yml
          rm -f MIGRATION_FETCH.md .github/inferbridge-migration-failure.log
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git commit -m "chore: remove one-time InferBridge migration bootstrap"
          git push origin HEAD:rename/inferbridge
          trap - EXIT
