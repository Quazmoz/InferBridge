name: Apply Loading Indicator Polish

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/apply-loading-indicator-polish.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused progress controller patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/progress_reliability.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              """    function scheduleRender(data, revision = ++nextStatusRevision) {
        if (revision < latestStatusRevision) return;
        latestStatus = data;
""",
              """    function scheduleRender(data, revision = ++nextStatusRevision) {
        if (revision < latestStatusRevision) return;
        latestStatusRevision = revision;
        latestStatus = data;
""",
              1,
          )

          if "ovrp-model-select-indicator" not in text:
              text = text.replace(
                  """        .ovrp-live{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
""",
                  """        .ovrp-live{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
        #ovrp-model-select-indicator{display:none;position:absolute;right:8px;top:50%;z-index:2;width:16px;height:16px;transform:translateY(-50%);pointer-events:none}
        #ovrp-model-select-indicator .ovrp-spinner{width:14px;height:14px;border-width:2px;background:var(--surface-2)}
        .model-select-wrap.ovrp-working #ovrp-model-select-indicator{display:block}.model-select-wrap.ovrp-working .model-arrow{visibility:hidden}.model-select-wrap.ovrp-working #model-select{padding-right:34px}
""",
                  1,
              )
              text = text.replace(
                  """    const main = dock.querySelector('.ovrp-main');
    const liveRegion = dock.querySelector('.ovrp-live');
""",
                  """    const main = dock.querySelector('.ovrp-main');
    const liveRegion = dock.querySelector('.ovrp-live');
    const modelSelect = document.getElementById('model-select');
    const modelSelectWrap = modelSelect?.closest('.model-select-wrap');
    const modelSelectIndicator = document.createElement('span');
    modelSelectIndicator.id = 'ovrp-model-select-indicator';
    modelSelectIndicator.setAttribute('aria-hidden', 'true');
    modelSelectIndicator.innerHTML = '<span class="ovrp-spinner"></span>';
    modelSelectWrap?.appendChild(modelSelectIndicator);
""",
                  1,
              )
              text = text.replace(
                  """    function setRenderTicker(enabled) {
""",
                  """    function syncSelectedPreparation(models, selectedId) {
        if (!modelSelect || !modelSelectWrap) return;
        const selected = models.find(model => model.id === selectedId) || null;
        const pending = selectedId ? optimistic.get(selectedId)?.model : null;
        const current = selected?.is_loading ? selected : pending;
        const busy = !!current?.is_loading;
        modelSelectWrap.classList.toggle('ovrp-working', busy);
        modelSelect.setAttribute('aria-busy', String(busy));
        if (busy) {
            const info = progressInfo(current);
            modelSelectIndicator.title = `${info.meta.label} ${baseName(current)}`;
            const loadButton = document.getElementById('load-model-btn');
            if (loadButton) {
                loadButton.disabled = true;
                loadButton.setAttribute('aria-busy', 'true');
            }
        } else {
            modelSelectIndicator.removeAttribute('title');
            document.getElementById('load-model-btn')?.removeAttribute('aria-busy');
        }
    }

    function setRenderTicker(enabled) {
""",
                  1,
              )
              text = text.replace(
                  """        const selectedId = document.getElementById('model-select')?.value;
        const active = chooseActiveModel(models, selectedId);
""",
                  """        const selectedId = modelSelect?.value || '';
        syncSelectedPreparation(models, selectedId);
        const active = chooseActiveModel(models, selectedId);
""",
                  1,
              )
              text = text.replace(
                  """        optimistic.set(modelId, { model, createdAt: Date.now() });
        const info = renderDock(model, 1);
""",
                  """        optimistic.set(modelId, { model, createdAt: Date.now() });
        if (modelSelect?.value === modelId) syncSelectedPreparation([model], modelId);
        const info = renderDock(model, 1);
""",
                  1,
              )

          required = [
              "latestStatusRevision = revision;\n        latestStatus = data;",
              "ovrp-model-select-indicator",
              "function syncSelectedPreparation",
              "syncSelectedPreparation(models, selectedId)",
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"Loading indicator patch incomplete: {missing}")
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_progress_reliability.py")
          test_text = test_path.read_text(encoding="utf-8")
          if "test_selected_model_indicator_is_immediate_and_state_driven" not in test_text:
              test_text += """


def test_selected_model_indicator_is_immediate_and_state_driven() -> None:
    script = PROGRESS_RELIABILITY_JS

    assert "ovrp-model-select-indicator" in script
    assert "syncSelectedPreparation" in script
    assert "modelSelect.setAttribute('aria-busy', String(busy))" in script
    assert "loadButton.setAttribute('aria-busy', 'true')" in script
    assert "modelSelectWrap.classList.toggle('ovrp-working', busy)" in script
    assert "latestStatusRevision = revision;\\n        latestStatus = data;" in script
"""
              test_path.write_text(test_text, encoding="utf-8")
          PY

          python -m py_compile app/progress_reliability.py tests/test_progress_reliability.py
          python - <<'PY'
          from pathlib import Path
          source = Path('app/progress_reliability.py').read_text(encoding='utf-8')
          start = source.index('PROGRESS_RELIABILITY_JS = r"""') + len('PROGRESS_RELIABILITY_JS = r"""')
          end = source.index('\n"""\n\n\ndef install_progress_ui_extension', start)
          Path('/tmp/progress-reliability.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/progress-reliability.js

          rm .github/workflows/apply-loading-indicator-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/progress_reliability.py tests/test_progress_reliability.py .github/workflows/apply-loading-indicator-polish.yml
          git commit -m "fix: polish selected model loading indicator"
          git pull --rebase origin development
          git push origin HEAD:development
