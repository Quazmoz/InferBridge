name: Cleanup obsolete validation branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  delete-obsolete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete validation branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          for branch in \
            validation/inferbridge-docs-final \
            validation/inferbridge-main-ci
          do
            git push "$remote" --delete "$branch" || true
          done
