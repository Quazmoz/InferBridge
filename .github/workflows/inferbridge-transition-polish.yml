name: Polish InferBridge transition compatibility

on:
  push:
    branches: ["rename/inferbridge"]
    paths: [".github/workflows/inferbridge-transition-polish.yml"]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/inferbridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Preserve pre-rename release URLs and historical downloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest = Path('scripts/release_manifest.py')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('import importlib.metadata\nimport re\n', 'import importlib.metadata\nimport os\nimport re\n', 1)
          marker = 'from scripts.release_scan import sha256_file\n\n\n'
          helper = '''from scripts.release_scan import sha256_file\n\n\n_ALLOWED_RELEASE_REPOSITORIES = {\n    "Quazmoz/openvino-windows-llm",\n    "Quazmoz/InferBridge",\n}\n\n\ndef release_repository(environment: dict[str, str] | None = None) -> str:\n    values = os.environ if environment is None else environment\n    configured = str(values.get("OV_LLM_RELEASE_REPOSITORY") or "").strip()\n    automatic = str(values.get("GITHUB_REPOSITORY") or "").strip()\n    selected = configured or automatic or "Quazmoz/openvino-windows-llm"\n    if selected not in _ALLOWED_RELEASE_REPOSITORIES:\n        raise ValueError("Release repository must be an approved InferBridge repository.")\n    return selected\n\n\n'''
          if marker not in text:
              raise SystemExit('release_manifest import marker not found')
          text = text.replace(marker, helper, 1)
          text = text.replace(
              '    base = f"https://github.com/Quazmoz/InferBridge/releases/download/v{version}"\n',
              '    repository = release_repository()\n    base = f"https://github.com/{repository}/releases/download/v{version}"\n',
              1,
          )
          text = text.replace(
              '        release_notes_url=f"https://github.com/Quazmoz/InferBridge/releases/tag/v{version}",\n'
              '        known_issues_url=f"https://github.com/Quazmoz/InferBridge/blob/v{version}/docs/KNOWN_ISSUES.md",\n'
              '        compatibility_matrix_url=f"https://github.com/Quazmoz/InferBridge/blob/v{version}/docs/COMPATIBILITY_MATRIX.md",\n',
              '        release_notes_url=f"https://github.com/{repository}/releases/tag/v{version}",\n'
              '        known_issues_url=f"https://github.com/{repository}/blob/v{version}/docs/KNOWN_ISSUES.md",\n'
              '        compatibility_matrix_url=f"https://github.com/{repository}/blob/v{version}/docs/COMPATIBILITY_MATRIX.md",\n',
              1,
          )
          manifest.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '**Current development version: `0.6.3`.** Release preparation adds shared application branding to the browser, launcher, installer, shortcuts, and uninstall registration. Stable publication now requires independently verified Authenticode signatures for both the installer and portable launcher. No 0.6.3 release has been published.',
              '**Current development version: `0.7.0`.** This branch rebrands the product as InferBridge while preserving OpenVINO GenAI, existing models and settings, legacy command-line interfaces, installer upgrade identity, and old/new update sources. No 0.7.0 release has been published.',
              1,
          )
          text = text.replace(
              'https://github.com/Quazmoz/InferBridge/releases/download/v0.6.1/InferBridge-0.6.1-windows-x64-installer.exe',
              'https://github.com/Quazmoz/openvino-windows-llm/releases/download/v0.6.1/OpenVINO-Windows-LLM-0.6.1-windows-x64-installer.exe',
              1,
          )
          text = text.replace(
              'https://github.com/Quazmoz/InferBridge/releases/download/v0.6.1/InferBridge-0.6.1-windows-x64-portable.zip',
              'https://github.com/Quazmoz/openvino-windows-llm/releases/download/v0.6.1/OpenVINO-Windows-LLM-0.6.1-windows-x64-portable.zip',
              1,
          )
          text = text.replace(
              'https://github.com/Quazmoz/InferBridge/releases/download/v0.6.1/InferBridge-0.6.1-checksums.txt',
              'https://github.com/Quazmoz/openvino-windows-llm/releases/download/v0.6.1/OpenVINO-Windows-LLM-0.6.1-checksums.txt',
              1,
          )
          text = text.replace(
              'Downloads (GitHub release `v0.6.1`):\n',
              'Downloads (GitHub release `v0.6.1`; historical assets retain the original product filenames):\n',
              1,
          )
          readme.write_text(text, encoding='utf-8')

          migration = Path('docs/INFERBRIDGE_MIGRATION.md')
          text = migration.read_text(encoding='utf-8')
          addition = '''\n## Release repository selection\n\nBefore the GitHub repository is renamed, release manifests default to `Quazmoz/openvino-windows-llm` so a compatibility release contains live asset and documentation URLs. After the rename, GitHub Actions selects `Quazmoz/InferBridge` through `GITHUB_REPOSITORY`. Local release builds may set `OV_LLM_RELEASE_REPOSITORY` to either approved repository during the transition.\n'''
          if '## Release repository selection' not in text:
              text += addition
          migration.write_text(text, encoding='utf-8')

          Path('tests/test_inferbridge_release_repository.py').write_text('''import pytest\n\nfrom scripts.release_manifest import release_repository\n\n\ndef test_release_repository_defaults_to_legacy_before_rename():\n    assert release_repository({}) == "Quazmoz/openvino-windows-llm"\n\n\ndef test_release_repository_uses_renamed_github_repository():\n    assert release_repository({"GITHUB_REPOSITORY": "Quazmoz/InferBridge"}) == "Quazmoz/InferBridge"\n\n\ndef test_release_repository_allows_explicit_transition_override():\n    assert release_repository({"OV_LLM_RELEASE_REPOSITORY": "Quazmoz/InferBridge"}) == "Quazmoz/InferBridge"\n\n\ndef test_release_repository_rejects_lookalike_repository():\n    with pytest.raises(ValueError):\n        release_repository({"OV_LLM_RELEASE_REPOSITORY": "Quazmoz/InferBridge-malicious"})\n''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/INFERBRIDGE_MIGRATION.md scripts/release_manifest.py tests/test_inferbridge_release_repository.py
          git commit -m "fix: preserve pre-rename release transition"
          git push origin HEAD:rename/inferbridge
      - name: Validate polished migration
        shell: bash
        env:
          OV_LLM_MOCK: "true"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          ruff check .
          ruff format --check .
          pytest
      - name: Remove one-time polish workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/inferbridge-transition-polish.yml
          git add -A
          git commit -m "chore: remove InferBridge transition polish"
          git push origin HEAD:rename/inferbridge
