# Windows/Python 3.12 source qualification only.
# Azure DevOps remains the sole manually queued packaged Windows release path.
name: Windows Python 3.12 source qualification

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/python312-windows.yml'
      - 'azure-pipelines.yml'
      - 'pyproject.toml'
      - 'requirements/release.txt'
      - 'requirements-dev.txt'
      - 'app/**'
      - 'packaging/msix/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'tests/**'
      - 'windows-native/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python312-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python312:
    name: Python 3.12 x64 / Ruff / Azure and WinUI contracts
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Verify Azure-compatible 64-bit Python 3.12
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12) and sys.maxsize > 2**32, sys.version; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Expected x64 Python 3.12.' }
      - name: Parse installed-MSIX smoke and certification crash triage scripts
        shell: pwsh
        run: |
          foreach ($path in @('scripts/inspect_store_crash.ps1', 'scripts/smoke_test_msix.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }
      - name: Fast-fail Azure-pinned Ruff gates
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-deps ruff==0.16.10
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Ruff install failed.' }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Ruff lint failed.' }
          python -m ruff format --check .
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Ruff format failed.' }
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Validate Azure artifact selection and Windows native source contracts
        run: |
          python -m pytest -q tests/test_linux_smoke_script.py tests/test_azure_artifact_selection.py tests/test_ci_dependency_contract.py tests/test_native_windows_source_contract.py

  windows-python312-release-deps:
    name: Python 3.12 x64 / pinned release environment / full pytest
    needs: windows-python312
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: |
            requirements/release.txt
            pyproject.toml
      - name: Verify pinned release dependency contract
        run: python scripts/release_tools.py verify-requirements --path requirements/release.txt
      - name: Install exact release dependency pins
        run: python -m pip install --disable-pip-version-check -r requirements/release.txt
      - name: Install package without resolving different dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Verify release environment provenance and dependency health
        run: |
          python -m pip check
          python scripts/release_environment.py write-metadata --requirements requirements/release.txt --metadata .ci-release-environment.json
          python scripts/release_environment.py validate --requirements requirements/release.txt --metadata .ci-release-environment.json
      - name: Validate real Optimum Intel CLI and converter flags
        run: python scripts/check_conversion_cli.py
      - name: Validate embedded browser JavaScript
        run: python scripts/check_injected_javascript.py
      - name: Run full pytest suite in mock mode
        env:
          OV_LLM_MOCK: 'true'
        run: python -m pytest

  windows-native:
    name: Native WinUI x64 publish / C# contract tests
    needs: windows-python312
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run native backend contract tests
        shell: pwsh
        run: |
          dotnet run --project windows-native/InferBridge.Native.ContractTests/InferBridge.Native.ContractTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Native backend contract tests failed.' }
      - name: Publish native WinUI frontend without packaging
        shell: pwsh
        run: |
          $nativeRoot = Join-Path $env:RUNNER_TEMP 'inferbridge-native-qualification'
          dotnet publish windows-native/InferBridge.Native/InferBridge.Native.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o $nativeRoot
          if ($LASTEXITCODE -ne 0) { throw 'Native WinUI publish failed.' }
          foreach ($name in @('InferBridge.Native.exe', 'InferBridge.Native.runtimeconfig.json', 'InferBridge.Native.deps.json', 'coreclr.dll', 'Microsoft.UI.Xaml.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $nativeRoot $name) -PathType Leaf)) {
              throw "Native WinUI publish missing required file: $name"
            }
          }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Pack a structural Store MSIX (real WinUI client, placeholder engine, never uploaded)
        shell: pwsh
        run: |
          # Validates the manifest, every scaled/unplated logo and resources.pri with the
          # Windows SDK's MakePri and MakeAppx. Not a release candidate: the engine is a stub.
          python -m pip install --disable-pip-version-check pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed.' }
          $engine = Join-Path $env:RUNNER_TEMP 'inferbridge-msix-engine'
          New-Item (Join-Path $engine '_internal') -ItemType Directory -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $engine 'InferBridge.exe') -Value 'placeholder engine'
          Set-Content -LiteralPath (Join-Path $engine '_internal\python312.dll') -Value 'placeholder runtime'
          $out = Join-Path $env:RUNNER_TEMP 'inferbridge-msix-out'
          $publisher = 'CN=CAC9A06A-996E-4DC7-9079-45803515E811'
          ./scripts/build_msix.ps1 -Version 1.1.0 -DistributionPath $engine `
            -NativePublishDirectory (Join-Path $env:RUNNER_TEMP 'inferbridge-native-qualification') `
            -OutputDirectory $out -IdentityName QuinnFavo.InferBridge -Publisher $publisher -PublisherDisplayName 'Quinn Favo'
          $package = Join-Path $out 'InferBridge-1.1.0-windows-x64.msix'
          python -c "import sys; from pathlib import Path; from scripts.select_azure_artifacts import verify_msix; verify_msix(Path(sys.argv[1]), identity='QuinnFavo.InferBridge', publisher=sys.argv[2], version='1.1.0')" $package $publisher
          if ($LASTEXITCODE -ne 0) { throw 'Structural MSIX verification failed.' }
