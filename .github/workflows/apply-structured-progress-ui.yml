name: Apply Structured Progress UI

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/apply-structured-progress-ui.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply operation-aware UI integration
        run: python .github/scripts/apply_structured_progress_ui.py

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Format and validate changed Python
        run: |
          ruff format \
            runtime/progress_protocol.py \
            runtime/model_converter.py \
            app/structured_progress.py \
            app/config.py \
            app/progress_reliability.py \
            tests/test_progress_protocol.py \
            tests/test_structured_progress.py \
            tests/test_model_converter.py \
            tests/test_server_mock.py \
            tests/test_progress_reliability.py
          ruff check \
            runtime/progress_protocol.py \
            runtime/model_converter.py \
            app/structured_progress.py \
            app/config.py \
            app/progress_reliability.py \
            tests/test_progress_protocol.py \
            tests/test_structured_progress.py \
            tests/test_model_converter.py \
            tests/test_server_mock.py \
            tests/test_progress_reliability.py

      - name: Validate browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.progress_reliability import PROGRESS_RELIABILITY_JS
          Path('/tmp/inferbridge-progress.js').write_text(PROGRESS_RELIABILITY_JS, encoding='utf-8')
          PY
          node --check /tmp/inferbridge-progress.js

      - name: Run focused regression suite
        env:
          OV_LLM_MOCK: "true"
        run: >-
          pytest
          tests/test_progress_protocol.py
          tests/test_structured_progress.py
          tests/test_model_converter.py
          tests/test_progress_reliability.py
          tests/test_progress_ui.py
          tests/test_conversion_stream_safety.py
          tests/test_server_mock.py

      - name: Commit validated implementation and remove temporary tooling
        run: |
          rm .github/scripts/apply_structured_progress_ui.py
          rm .github/workflows/apply-structured-progress-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add structured progress operations"
          git push origin HEAD:development
