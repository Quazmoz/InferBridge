name: Loading Indicator Diagnostics

on:
  push:
    branches: ["development"]
    paths:
      - "app/progress_reliability.py"
      - "tests/test_progress_reliability.py"
      - ".github/workflows/loading-indicator-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run focused diagnostics
        shell: bash
        run: |
          set +e
          ruff check app/progress_reliability.py tests/test_progress_reliability.py > /tmp/ruff-check.txt 2>&1
          ruff_check=$?
          ruff format --check app/progress_reliability.py tests/test_progress_reliability.py > /tmp/ruff-format.txt 2>&1
          ruff_format=$?
          pytest tests/test_progress_reliability.py tests/test_model_lifecycle_ui.py tests/test_gui_stability.py > /tmp/pytest.txt 2>&1
          pytest_status=$?
          set -e

          mkdir -p .audit
          {
            echo "validated_sha=${GITHUB_SHA}"
            echo "ruff_check=${ruff_check}"
            echo "ruff_format=${ruff_format}"
            echo "pytest=${pytest_status}"
            echo "--- ruff check ---"
            tail -80 /tmp/ruff-check.txt
            echo "--- ruff format ---"
            tail -80 /tmp/ruff-format.txt
            echo "--- pytest ---"
            tail -120 /tmp/pytest.txt
          } > .audit/loading-indicators-diagnostic.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .audit/loading-indicators-diagnostic.txt
          git commit -m "[skip ci] ci: record loading indicator diagnostics"
          git push origin HEAD:development
