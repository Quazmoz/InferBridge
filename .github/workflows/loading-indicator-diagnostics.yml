name: Loading Indicator Diagnostics

on:
  push:
    branches: ["development"]
    paths:
      - "app/progress_reliability.py"
      - "tests/test_progress_reliability.py"
      - ".github/workflows/loading-indicator-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python 3.11 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Python 3.11 diagnostics
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/ruff-check.txt 2>&1
          echo $? > /tmp/ruff-check.status
          ruff format --check . > /tmp/ruff-format.txt 2>&1
          echo $? > /tmp/ruff-format.status
          pytest > /tmp/pytest-311.txt 2>&1
          echo $? > /tmp/pytest-311.status
          set -e

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python 3.13 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Python 3.13 test suite
        shell: bash
        run: |
          set +e
          pytest > /tmp/pytest-313.txt 2>&1
          echo $? > /tmp/pytest-313.status
          set -e

      - name: Record diagnostics
        shell: bash
        run: |
          mkdir -p .audit
          {
            echo "validated_sha=${GITHUB_SHA}"
            echo "ruff_check=$(cat /tmp/ruff-check.status)"
            echo "ruff_format=$(cat /tmp/ruff-format.status)"
            echo "pytest_311=$(cat /tmp/pytest-311.status)"
            echo "pytest_313=$(cat /tmp/pytest-313.status)"
            echo "--- ruff check ---"
            tail -100 /tmp/ruff-check.txt
            echo "--- ruff format ---"
            tail -100 /tmp/ruff-format.txt
            echo "--- pytest 3.11 ---"
            tail -160 /tmp/pytest-311.txt
            echo "--- pytest 3.13 ---"
            tail -160 /tmp/pytest-313.txt
          } > .audit/loading-indicators-diagnostic.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .audit/loading-indicators-diagnostic.txt
          git commit -m "[skip ci] ci: record full loading indicator diagnostics"
          git pull --rebase origin development
          git push origin HEAD:development
