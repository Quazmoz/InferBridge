name: Diagnose Final Split Status

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/diagnose-status-split-final.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Capture Linux and external contract output
        shell: bash
        env:
          OV_LLM_MOCK: "true"
        run: |
          set +e
          ruff check . > /tmp/ruff-check.txt 2>&1
          ruff_check=$?
          ruff format --check . > /tmp/ruff-format.txt 2>&1
          ruff_format=$?
          pytest > /tmp/pytest.txt 2>&1
          pytest_status=$?

          python -m app.server \
            --mock \
            --host 127.0.0.1 \
            --port 8123 \
            --model tinyllama-1.1b-chat-fp16 \
            > /tmp/contract-server.txt 2>&1 &
          server_pid=$!
          python scripts/validate_api_contract.py \
            --base-url http://127.0.0.1:8123 \
            --profile full \
            --model tinyllama-1.1b-chat-fp16 \
            --device CPU \
            --expect-mock \
            --include-embeddings \
            --run-benchmark \
            --exercise-lifecycle \
            --load-timeout 60 \
            --timeout 30 \
            --output-json /tmp/contract-report.json \
            --output-markdown /tmp/contract-report.md \
            > /tmp/contract.txt 2>&1
          contract_status=$?
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          set -e

          mkdir -p .audit
          {
            echo "validated_sha=${GITHUB_SHA}"
            echo "ruff_check=${ruff_check}"
            echo "ruff_format=${ruff_format}"
            echo "pytest=${pytest_status}"
            echo "external_contract=${contract_status}"
            echo "--- ruff check ---"
            tail -160 /tmp/ruff-check.txt
            echo "--- ruff format ---"
            tail -160 /tmp/ruff-format.txt
            echo "--- pytest ---"
            tail -420 /tmp/pytest.txt
            echo "--- external contract ---"
            tail -260 /tmp/contract.txt
            echo "--- server ---"
            tail -260 /tmp/contract-server.txt
            echo "--- contract report ---"
            if [ -f /tmp/contract-report.md ]; then tail -180 /tmp/contract-report.md; fi
          } > .audit/status-split-diagnostic.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add .audit/status-split-diagnostic.txt
          git commit -m "[skip ci] ci: record split status diagnostic"
          git push origin HEAD:development

# rerun live metrics
