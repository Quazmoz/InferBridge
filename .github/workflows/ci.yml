name: Final InferBridge documentation identity

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/ci.yml"]

permissions:
  contents: write

jobs:
  finalize-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OV_LLM_MOCK: "true"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Finalize README and audit current identity
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          old_status = (
              "**Current development version: `0.7.0`.** This branch rebrands the product as "
              "InferBridge while preserving OpenVINO GenAI, existing models and settings, legacy "
              "command-line interfaces, installer upgrade identity, and old/new update sources. "
              "No 0.7.0 release has been published."
          )
          new_status = (
              "**Current development version: `0.7.0`.** Version 0.7.0 completes the InferBridge "
              "product and repository rename while preserving OpenVINO GenAI, existing models and "
              "settings, legacy command-line interfaces, installer upgrade identity, and approved "
              "current and legacy update sources. No 0.7.0 release has been published."
          )
          if old_status not in readme:
              raise SystemExit("Expected README development-status paragraph was not found.")
          readme = readme.replace(old_status, new_status, 1)

          docs_marker = "- [Experimental Linux overview](docs/LINUX.md)\n"
          docs_addition = (
              docs_marker
              + "- [InferBridge migration and repository rename](docs/INFERBRIDGE_MIGRATION.md)\n"
              + "- [InferBridge identity inventory](docs/INFERBRIDGE_IDENTITY_INVENTORY.md)\n"
          )
          if docs_marker not in readme:
              raise SystemExit("README documentation marker was not found.")
          if "docs/INFERBRIDGE_MIGRATION.md" not in readme:
              readme = readme.replace(docs_marker, docs_addition, 1)

          readme_path.write_text(readme, encoding="utf-8")

          current_docs = [
              Path("README.md"),
              Path("QUICKSTART.md"),
              Path("CONTRIBUTING.md"),
              Path("OPENWEBUI.md"),
              Path("docs/API_CONTRACT.md"),
              Path("docs/DIAGNOSTICS.md"),
              Path("docs/FEDORA.md"),
              Path("docs/INFERBRIDGE_IDENTITY_INVENTORY.md"),
              Path("docs/INFERBRIDGE_MIGRATION.md"),
              Path("docs/MODEL_LIBRARY.md"),
              Path("docs/PACKAGING_RELEASE.md"),
              Path("docs/RELEASE_PROCESS.md"),
              Path("docs/UBUNTU.md"),
              Path("docs/releases/0.7.0.md"),
              Path(".claude/skills/use_memoryops.md"),
              Path(".gemini/skills/use_memoryops.md"),
          ]
          forbidden = {
              "legacy clone URL": "git clone https://github.com/Quazmoz/openvino-windows-llm.git",
              "legacy clone directory": "cd openvino-windows-llm",
              "legacy diagnostics archive": "openvino-windows-llm-diagnostics-",
              "legacy canonical model manifest": (
                  "https://github.com/Quazmoz/openvino-windows-llm/releases/latest/download/"
                  "model-library-manifest.json"
              ),
              "legacy API product opening": "OpenVINO Windows LLM implements",
              "stale pre-rename branch wording": "This branch rebrands the product as InferBridge",
          }
          failures = []
          for path in current_docs:
              text = path.read_text(encoding="utf-8")
              for label, needle in forbidden.items():
                  if needle in text:
                      failures.append(f"{path}: {label}")
          if failures:
              raise SystemExit("Current identity audit failed:\n" + "\n".join(failures))

          required = {
              "README.md": [
                  "# InferBridge",
                  "https://github.com/Quazmoz/InferBridge.git",
                  "docs/INFERBRIDGE_MIGRATION.md",
                  "docs/INFERBRIDGE_IDENTITY_INVENTORY.md",
              ],
              "pyproject.toml": [
                  'Homepage = "https://github.com/Quazmoz/InferBridge"',
                  'Repository = "https://github.com/Quazmoz/InferBridge"',
              ],
              "docs/DIAGNOSTICS.md": ["inferbridge-diagnostics-YYYYMMDD-HHMMSS.zip"],
              "docs/MODEL_LIBRARY.md": [
                  "https://github.com/Quazmoz/InferBridge/releases/latest/download/"
                  "model-library-manifest.json"
              ],
              ".claude/skills/use_memoryops.md": [
                  '"agent_id": "inferbridge"',
                  '"repo": "Quazmoz/InferBridge"',
              ],
              ".gemini/skills/use_memoryops.md": [
                  '"agent_id": "inferbridge"',
                  '"repo": "Quazmoz/InferBridge"',
              ],
          }
          for name, needles in required.items():
              text = Path(name).read_text(encoding="utf-8")
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f"{name} is missing required InferBridge identity: {missing}")

          # Historical 0.6.1 assets must retain their published names and former repository path.
          readme = readme_path.read_text(encoding="utf-8")
          if "OpenVINO-Windows-LLM-0.6.1-windows-x64-installer.exe" not in readme:
              raise SystemExit("README no longer preserves the historical 0.6.1 asset identity.")
          PY

      - name: Run source validation
        run: |
          ruff check .
          ruff format --check .
          pytest

      - name: Restore normal CI and commit validated cleanup
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/ci.yml
          git commit -m "docs: complete InferBridge identity cleanup"
          git push origin HEAD:main
