name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "development", "beta"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate embedded browser JavaScript
        run: python scripts/check_injected_javascript.py

      - name: Run Ruff lint and format checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest in mock mode
        env:
          OV_LLM_MOCK: "true"
        run: pytest

  external-contract-smoke:
    name: External API Contract Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Start mock server
        env:
          OV_LLM_MOCK: "true"
        run: |
          python -m app.server \
            --mock \
            --host 127.0.0.1 \
            --port 8123 \
            --model tinyllama-1.1b-chat-fp16 \
            > contract-server.log 2>&1 &
          echo $! > contract-server.pid

      - name: Validate external OpenAI and integration contracts
        run: |
          python scripts/validate_api_contract.py \
            --base-url http://127.0.0.1:8123 \
            --profile full \
            --model tinyllama-1.1b-chat-fp16 \
            --device CPU \
            --expect-mock \
            --include-embeddings \
            --run-benchmark \
            --exercise-lifecycle \
            --load-timeout 60 \
            --timeout 30 \
            --output-json contract-report.json \
            --output-markdown contract-report.md

      - name: Show server log on failure
        if: failure()
        run: tail -200 contract-server.log

      - name: Stop mock server
        if: always()
        run: |
          if [ -f contract-server.pid ]; then
            kill "$(cat contract-server.pid)" 2>/dev/null || true
          fi

      - name: Upload contract report for failures or manual runs
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: external-api-contract-report
          path: |
            contract-report.json
            contract-report.md
          if-no-files-found: ignore
          retention-days: 1

  windows-harness-syntax:
    name: Windows Harness Syntax
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5

      - name: Parse PowerShell release, certification, and setup scripts
        shell: pwsh
        run: |
          $paths = @(
            "scripts/build_dev_package.ps1",
            "scripts/build_release.ps1",
            "scripts/build_windows_distribution.ps1",
            "scripts/publish_release.ps1",
            "scripts/test_openwebui_compat.ps1",
            "scripts/smoke_test_packaged.ps1",
            "scripts/validate_mock_contract.ps1",
            "scripts/validate_windows.ps1",
            "setup/windows/check_hardware.ps1",
            "setup/windows/install_deps.ps1",
            "setup/windows/setup_all.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }

      - name: Compile Python release, packaging, and UI tools
        run: >-
          python -m py_compile
          packaging/runtime_hook.py
          app/cancellation_ui.py
          app/context_budget.py
          app/context_budget_ui.py
          app/conversation_management_ui.py
          app/desktop_server.py
          app/header_overflow_ui.py
          app/hf_search_ui.py
          app/huggingface_access.py
          app/huggingface_access_ui.py
          app/model_cancellation.py
          app/model_lifecycle_ui.py
          app/model_preparation_timeouts.py
          app/model_recovery.py
          app/model_recovery_cleanup.py
          app/model_recovery_status.py
          app/model_recovery_ui.py
          app/operation_queue_ui.py
          app/progress_operation_ui.py
          app/request_logging.py
          app/responsive_ui.py
          app/responses_api.py
          app/runtime_health.py
          app/runtime_health_ui.py
          app/status_split.py
          app/status_split_ui.py
          app/storage_manager.py
          app/storage_manager_ui.py
          app/storage_root_safety.py
          app/storage_safety.py
          app/storage_state.py
          app/structured_progress.py
          runtime/model_artifacts.py
          runtime/model_converter.py
          runtime/model_output_transaction.py
          runtime/progress_protocol.py
          scripts/release_tools.py
          scripts/release_manifest.py
          scripts/release_scan.py
          scripts/verify_release_signing.py
          scripts/verify_release_provenance.py
          scripts/certify_context_depth.py
          scripts/certify_conversion_lifecycle.py
          scripts/validate_api_contract.py
          scripts/validate_model_library_manifest.py

      - name: Install targeted test dependencies
        run: python -m pip install -e .[dev]

      - name: Run targeted release, packaging, UI, lifecycle, and resilience tests
        env:
          OV_LLM_MOCK: "true"
        run: >-
          pytest
          tests/test_dev_package_script.py
          tests/test_release_pipeline.py
          tests/test_release_signing_gate.py
          tests/test_release_provenance.py
          tests/test_installer_upgrade_contract.py
          tests/test_runtime_hook_upgrade.py
          tests/test_cancellation_ui.py
          tests/test_context_budget.py
          tests/test_context_budget_ui.py
          tests/test_conversation_management_ui.py
          tests/test_errors.py
          tests/test_header_overflow_ui.py
          tests/test_hf_search_ui.py
          tests/test_huggingface_access.py
          tests/test_huggingface_access_ui.py
          tests/test_model_artifacts.py
          tests/test_model_cancellation.py
          tests/test_model_cancellation_race.py
          tests/test_model_lifecycle_ui.py
          tests/test_model_output_transaction.py
          tests/test_model_preparation_timeouts.py
          tests/test_model_recovery.py
          tests/test_model_recovery_cleanup.py
          tests/test_model_recovery_status.py
          tests/test_model_recovery_ui.py
          tests/test_model_registry.py
          tests/test_operation_queue_ui.py
          tests/test_progress_operation_ui.py
          tests/test_progress_protocol.py
          tests/test_request_logging.py
          tests/test_responses_api_parity.py
          tests/test_runtime_health.py
          tests/test_runtime_health_summary.py
          tests/test_runtime_health_ui.py
          tests/test_status_split.py
          tests/test_status_split_ui.py
          tests/test_storage_manager.py
          tests/test_storage_manager_second_pass.py
          tests/test_storage_manager_ui.py
          tests/test_storage_root_safety.py
          tests/test_structured_progress.py
          tests/test_structured_progress_tail.py
          tests/test_model_converter.py
          tests/test_progress_reliability.py
          tests/test_progress_ui.py
          tests/test_responsive_ui.py
          tests/test_hardware_advisor.py
          tests/test_model_library_evidence_identity.py
          tests/test_model_library_integrity.py
          tests/test_conversion_cancellation.py
          tests/test_conversion_stream_safety.py
          tests/test_config_resilience.py
          tests/test_onboarding_state_resilience.py
          tests/test_update_checker_resilience.py

  browser-behavior:
    name: Chromium Browser Behavior
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,browser]
          python -m playwright install --with-deps chromium

      - name: Run real Chromium behavior tests
        env:
          OV_LLM_MOCK: "true"
          INFERBRIDGE_BROWSER_ARTIFACTS: browser-artifacts
        run: pytest browser_tests -q

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-behavior-diagnostics
          path: browser-artifacts
          if-no-files-found: ignore
          retention-days: 3
