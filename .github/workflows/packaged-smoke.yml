# Manual-only packaged qualification. Builds the unsigned PyInstaller distribution
# through the same scripts/build_release.ps1 path the Azure DevOps release uses, and
# runs both the installed-mode and portable-mode packaged mock smoke tests. It never
# signs, publishes, tags or uploads release artifacts; Azure DevOps remains the release
# path. Use it to qualify packaged startup changes before queueing Azure.
name: Packaged Windows smoke (manual)

on:
  workflow_dispatch:
    inputs:
      skip_source_tests:
        description: "Skip pytest and the source mock contract (packaged smoke tests still run)"
        type: boolean
        default: false
      extra_smoke_runs:
        description: "Repeat the installed and portable packaged smoke tests this many extra times (flakiness check)"
        type: string
        default: '0'
      cpu_affinity_mask:
        description: "Optional CPU affinity mask for the build and smoke processes, e.g. 3 = two cores like Azure hosted agents"
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: packaged-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packaged-smoke:
    name: Unsigned build + installed and portable packaged smoke
    # Matches the Azure DevOps release agent image (azure-pipelines.yml vmImage).
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }

      - name: Prepare qualified release dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements/release.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release dependency installation failed' }
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { throw 'Project installation failed' }

      - name: Build unsigned release with installed and portable packaged smoke tests
        env:
          SKIP_SOURCE_TESTS: ${{ inputs.skip_source_tests }}
          CPU_AFFINITY_MASK: ${{ inputs.cpu_affinity_mask }}
        run: |
          if ($env:CPU_AFFINITY_MASK) {
            # Child processes (PyInstaller, the frozen tray and its server) inherit this.
            (Get-Process -Id $PID).ProcessorAffinity = [IntPtr][int64]$env:CPU_AFFINITY_MASK
            Write-Host "Processor affinity mask: $env:CPU_AFFINITY_MASK"
          }
          $arguments = @{
            Channel = 'auto'
            Unsigned = $true
            Clean = $true
            OutputDirectory = 'artifacts/packaged-smoke'
            Python = 'python'
          }
          if ($env:SKIP_SOURCE_TESTS -eq 'true') {
            # -MockSmokeTest keeps both packaged smoke tests enabled.
            $arguments.SkipTests = $true
            $arguments.MockSmokeTest = $true
          }
          & ./scripts/build_release.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "Release build failed with exit code $LASTEXITCODE" }

      - name: Repeat packaged smoke tests
        if: ${{ inputs.extra_smoke_runs != '0' && inputs.extra_smoke_runs != '' }}
        env:
          EXTRA_SMOKE_RUNS: ${{ inputs.extra_smoke_runs }}
          CPU_AFFINITY_MASK: ${{ inputs.cpu_affinity_mask }}
        run: |
          if ($env:CPU_AFFINITY_MASK) {
            (Get-Process -Id $PID).ProcessorAffinity = [IntPtr][int64]$env:CPU_AFFINITY_MASK
          }
          $runs = [int]$env:EXTRA_SMOKE_RUNS
          $python = @(Get-ChildItem build/release-environments -Filter python.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'Scripts' } | Select-Object -First 1)[0].FullName
          $distribution = (Resolve-Path dist/InferBridge).Path
          $marker = Join-Path $distribution 'portable.flag'
          $failures = 0
          for ($i = 1; $i -le $runs; $i++) {
            foreach ($mode in @('installed', 'portable')) {
              if ($mode -eq 'portable') { Set-Content -Path $marker -Value 'portable' -Encoding ascii }
              try {
                Write-Host "==> Extra packaged smoke $i/$runs ($mode)"
                & ./scripts/smoke_test_packaged.ps1 -DistributionPath $distribution -Python $python -ExpectedMode $mode
              }
              catch {
                $failures++
                Write-Host "::error::Extra packaged smoke $i/$runs ($mode) failed: $($_.Exception.Message)"
              }
              finally {
                Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
              }
            }
          }
          Write-Host "Extra packaged smoke failures: $failures of $($runs * 2)"
          if ($failures) { throw "$failures extra packaged smoke run(s) failed." }

      - name: Upload build timing and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-summary
          path: |
            build/release/release-timings.json
            artifacts/packaged-smoke/*-release-summary.json
          if-no-files-found: ignore
          retention-days: 7
