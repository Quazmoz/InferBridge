name: Diagnose Cancellation Integration

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/diagnose-cancellation-integration.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches and capture output
        shell: bash
        run: |
          set +e
          {
            python .github/scripts/apply_cancellation_and_browser.py
            first=$?
            echo "apply_status=${first}"
            if [ "${first}" -eq 0 ]; then
              python .github/scripts/fix_cancellation_race.py
              second=$?
            else
              second=99
            fi
            echo "race_status=${second}"
          } > /tmp/diagnostic.txt 2>&1
          set -e
          git reset --hard HEAD
          mkdir -p .audit
          {
            echo "validated_sha=${GITHUB_SHA}"
            cat /tmp/diagnostic.txt
          } > .audit/cancellation-integration-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .audit/cancellation-integration-diagnostic.txt
          git commit -m "[skip ci] ci: record cancellation integration diagnostic"
          git push origin HEAD:development
