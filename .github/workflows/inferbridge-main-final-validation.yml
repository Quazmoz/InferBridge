name: Final InferBridge main validation

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/inferbridge-main-final-validation.yml"]

permissions:
  contents: write

concurrency:
  group: inferbridge-main-final-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OV_LLM_MOCK: "true"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies for Python 3.11
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Apply and verify Ruff fixes
        shell: pwsh
        run: |
          ruff check . --fix
          if ($LASTEXITCODE -ne 0) { throw "Ruff automatic fixes failed." }
          ruff format .
          if ($LASTEXITCODE -ne 0) { throw "Ruff formatting failed." }
          ruff check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff lint failed after automatic fixes." }
          ruff format --check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff format check failed after formatting." }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Git whitespace validation failed." }

      - name: Parse PowerShell and compile Python tools
        shell: pwsh
        run: |
          $paths = @(
            "scripts/build_release.ps1",
            "scripts/build_windows_distribution.ps1",
            "scripts/publish_release.ps1",
            "scripts/test_openwebui_compat.ps1",
            "scripts/smoke_test_packaged.ps1",
            "scripts/validate_mock_contract.ps1",
            "scripts/validate_windows.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }
          python -m py_compile app/brand.py app/branding_ui.py app/diagnostics.py app/paths.py app/release_models.py app/server.py app/startup_registration.py app/update_checker.py packaging/runtime_hook.py scripts/release_manifest.py scripts/release_scan.py scripts/verify_release_signing.py scripts/verify_release_provenance.py
          if ($LASTEXITCODE -ne 0) { throw "Python compile validation failed." }
          python scripts/release_tools.py verify-version-consistency --root . --version 0.7.0
          if ($LASTEXITCODE -ne 0) { throw "Version consistency validation failed." }

      - name: Run full pytest suite on Python 3.11
        shell: pwsh
        run: |
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw "Python 3.11 pytest failed." }

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate Python 3.13
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          ruff check .
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 Ruff lint failed." }
          ruff format --check .
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 Ruff format check failed." }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 pytest failed." }

      - name: Commit validated cleanup and remove workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/workflows/inferbridge-main-final-validation.yml
          git add -A
          git commit -m "fix: clean InferBridge migration imports"
          git push origin HEAD:main
