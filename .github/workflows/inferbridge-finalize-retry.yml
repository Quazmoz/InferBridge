name: Retry repaired InferBridge finalization

on:
  push:
    branches: ["rename/inferbridge"]
    paths: [".github/workflows/inferbridge-finalize-retry.yml"]

permissions:
  contents: write

concurrency:
  group: inferbridge-finalization
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      OV_LLM_MOCK: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/inferbridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply repaired public and post-rename changes
        shell: pwsh
        run: |
          python .github/scripts/finalize_inferbridge_core.py
          python .github/scripts/finalize_inferbridge_ui.py
          python .github/scripts/write_inferbridge_final_tests.py
          @'
          from pathlib import Path

          path = Path("scripts/release_manifest.py")
          text = path.read_text(encoding="utf-8")
          if "from app.brand import LEGACY_REPOSITORY_NAME" not in text:
              text = text.replace(
                  "from app.build_info import BuildInfo\n",
                  "from app.brand import LEGACY_REPOSITORY_NAME, REPOSITORY_NAME, REPOSITORY_OWNER\nfrom app.build_info import BuildInfo\n",
                  1,
              )
          text = text.replace(
              '''_ALLOWED_RELEASE_REPOSITORIES = {\n    "Quazmoz/openvino-windows-llm",\n    "Quazmoz/InferBridge",\n}\n''',
              '''_ALLOWED_RELEASE_REPOSITORIES = {\n    f"{REPOSITORY_OWNER}/{REPOSITORY_NAME}",\n    f"{REPOSITORY_OWNER}/{LEGACY_REPOSITORY_NAME}",\n}\n_DEFAULT_RELEASE_REPOSITORY = f"{REPOSITORY_OWNER}/{REPOSITORY_NAME}"\n''',
          )
          text = text.replace(
              'selected = configured or automatic or "Quazmoz/openvino-windows-llm"',
              "selected = configured or automatic or _DEFAULT_RELEASE_REPOSITORY",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("app/update_checker.py")
          text = path.read_text(encoding="utf-8").replace(
              "for repository in (LEGACY_REPOSITORY_NAME, REPOSITORY_NAME)",
              "for repository in (REPOSITORY_NAME, LEGACY_REPOSITORY_NAME)",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("CONTRIBUTING.md")
          text = path.read_text(encoding="utf-8").replace(
              "git clone https://github.com/<your-username>/openvino-windows-llm.git",
              "git clone https://github.com/<your-username>/InferBridge.git",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_inferbridge_release_repository.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("defaults_to_legacy_before_rename", "defaults_to_canonical_after_rename")
          text = text.replace(
              'assert release_repository({}) == "Quazmoz/openvino-windows-llm"',
              'assert release_repository({}) == "Quazmoz/InferBridge"',
          )
          path.write_text(text, encoding="utf-8")
          '@ | python -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize InferBridge public and repository identity"
          git push origin HEAD:rename/inferbridge

      - name: Install and format
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          ruff check . --fix
          ruff format .
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style: format final InferBridge migration"
            git push origin HEAD:rename/inferbridge
          }

      - name: Validate code and tests
        shell: pwsh
        run: |
          $Out = "$env:RUNNER_TEMP\inferbridge-final"
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          ruff check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff lint failed" }
          ruff format --check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff format failed" }
          python scripts/release_tools.py verify-version-consistency --root . --version 0.7.0
          if ($LASTEXITCODE -ne 0) { throw "Version consistency failed" }
          python -m pytest 2>&1 | Tee-Object "$Out\full.txt"
          if ($LASTEXITCODE -ne 0) { throw "Full pytest failed" }
          python -m pytest tests/test_inferbridge_brand.py tests/test_inferbridge_paths.py tests/test_inferbridge_startup.py tests/test_inferbridge_update_compatibility.py tests/test_inferbridge_packaging_contract.py tests/test_inferbridge_release_repository.py tests/test_inferbridge_public_branding.py tests/test_inferbridge_runtime_hook_paths.py tests/test_release_pipeline.py tests/test_release_signing_gate.py tests/test_release_provenance.py tests/test_installer_upgrade_contract.py tests/test_runtime_hook_upgrade.py tests/test_update_checker.py tests/test_update_checker_resilience.py tests/test_release_models.py 2>&1 | Tee-Object "$Out\targeted.txt"
          if ($LASTEXITCODE -ne 0) { throw "Targeted pytest failed" }

      - name: Build unsigned Windows distribution
        shell: pwsh
        run: |
          $Out = "$env:RUNNER_TEMP\inferbridge-final"
          $Candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $Iscc = $Candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $Args = @{ Version="0.7.0"; Channel="stable"; Clean=$true; Unsigned=$true; SkipTests=$true; MockSmokeTest=$true }
          if ($Iscc) { $Args.IsccPath=$Iscc; "available" | Set-Content "$Out\inno.txt" }
          else { $Args.SkipInstaller=$true; "unavailable; installer skipped" | Set-Content "$Out\inno.txt" }
          & .\scripts\build_release.ps1 @Args 2>&1 | Tee-Object "$Out\build.txt"
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Record validation and clean bootstrap
        shell: pwsh
        run: |
          $Out = "$env:RUNNER_TEMP\inferbridge-final"
          $Full = (Get-Content "$Out\full.txt" | Select-Object -Last 5) -join "`n"
          $Targeted = (Get-Content "$Out\targeted.txt" | Select-Object -Last 5) -join "`n"
          $Build = (Get-Content "$Out\build.txt" | Select-Object -Last 20) -join "`n"
          $Inno = (Get-Content "$Out\inno.txt" -Raw).Trim()
          $Artifacts = (Get-ChildItem artifacts\release-0.7.0 -File | Sort-Object Name | ForEach-Object { "- ``$($_.Name)``: $($_.Length) bytes" }) -join "`n"
          New-Item -ItemType Directory -Force docs\validation | Out-Null
          @"
          # InferBridge branch validation

          - Repository: ``Quazmoz/InferBridge``
          - Branch: ``rename/inferbridge``
          - Validated commit: ``$((git rev-parse HEAD).Trim())``
          - Platform: GitHub-hosted ``windows-latest``
          - Inno Setup: $Inno
          - Signing: not performed; artifacts are explicitly unsigned
          - Real Intel hardware validation: not performed

          ## Full pytest
          ```text
          $Full
          ```

          ## Targeted pytest
          ```text
          $Targeted
          ```

          ## Build tail
          ```text
          $Build
          ```

          ## Artifacts
          $Artifacts

          ## Remaining physical validation
          Real legacy-installer upgrade, shortcuts, Add or Remove Programs, startup registry, uninstall data choices, trusted Authenticode signing, Intel CPU/GPU/NPU/AUTO inference, and disposable-repository redirect testing remain unverified.
          "@ | Set-Content docs\validation\inferbridge-branch-validation.md -Encoding utf8

          Remove-Item .github\scripts\finalize_inferbridge_core.py
          Remove-Item .github\scripts\finalize_inferbridge_ui.py
          Remove-Item .github\scripts\write_inferbridge_final_tests.py
          Remove-Item .github\workflows\inferbridge-public-branding-finalize.yml -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\inferbridge-post-rename-finalize.yml -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\inferbridge-finalize-retry.yml
          git add -A
          git commit -m "test: record final InferBridge Windows validation"
          git push origin HEAD:rename/inferbridge
