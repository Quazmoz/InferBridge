name: Diagnose Final Cancellation

on:
  push:
    branches: ["development"]
    paths:
      - ".github/workflows/diagnose-final-cancellation.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,browser]
          python -m playwright install --with-deps chromium

      - name: Capture validation output
        shell: bash
        env:
          OV_LLM_MOCK: "true"
          INFERBRIDGE_BROWSER_ARTIFACTS: browser-artifacts
        run: |
          set +e
          ruff check . > /tmp/ruff-check.txt 2>&1
          ruff_check=$?
          ruff format --check . > /tmp/ruff-format.txt 2>&1
          ruff_format=$?
          pytest > /tmp/pytest.txt 2>&1
          pytest_status=$?
          pytest browser_tests -q > /tmp/browser.txt 2>&1
          browser_status=$?
          set -e

          mkdir -p .audit
          {
            echo "validated_sha=${GITHUB_SHA}"
            echo "ruff_check=${ruff_check}"
            echo "ruff_format=${ruff_format}"
            echo "pytest=${pytest_status}"
            echo "browser=${browser_status}"
            echo "--- ruff check ---"
            tail -120 /tmp/ruff-check.txt
            echo "--- ruff format ---"
            tail -120 /tmp/ruff-format.txt
            echo "--- pytest ---"
            tail -240 /tmp/pytest.txt
            echo "--- browser ---"
            tail -280 /tmp/browser.txt
          } > .audit/cancellation-final-diagnostic.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add .audit/cancellation-final-diagnostic.txt
          git commit -m "[skip ci] ci: record final cancellation diagnostic"
          git push origin HEAD:development
