name: One-time branch cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/branch-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete obsolete branches
        shell: bash
        run: |
          git push origin --delete development
          git push origin --delete dependabot/pip/development/python-runtime-b249ccf259
