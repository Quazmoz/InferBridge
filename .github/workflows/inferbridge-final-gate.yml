name: Final InferBridge Windows gate

on:
  push:
    branches: ["rename/inferbridge"]
    paths: [".github/workflows/inferbridge-final-gate.yml"]

permissions:
  contents: write

concurrency:
  group: inferbridge-final-gate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      OV_LLM_MOCK: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/inferbridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply idempotent finalizers
        shell: pwsh
        run: |
          python .github/scripts/finalize_inferbridge_core.py
          python .github/scripts/finalize_inferbridge_ui.py
          python .github/scripts/write_inferbridge_final_tests.py
          @'
          from pathlib import Path

          path = Path("tests/test_update_checker.py")
          text = path.read_text(encoding="utf-8")
          if "from app.brand import USER_AGENT_PRODUCT" not in text:
              text = text.replace(
                  "from app.release_models import artifact_filename\n",
                  "from app.brand import USER_AGENT_PRODUCT\n"
                  "from app.release_models import artifact_filename\n"
                  "from app.version import __version__\n",
                  1,
              )
          text = text.replace(
              '"OpenVINO-Windows-LLM/0.6.3" in headers.get("User-agent", "")',
              'f"{USER_AGENT_PRODUCT}/{__version__}" in headers.get("User-agent", "")',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_inferbridge_update_compatibility.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from app.update_checker import _candidate_manifest_url\n",
              "from app.update_checker import _RELEASES_APIS, _candidate_manifest_url\n",
          )
          if "test_canonical_release_api_is_checked_before_legacy_fallback" not in text:
              text += (
                  '\n\ndef test_canonical_release_api_is_checked_before_legacy_fallback():\n'
                  '    assert "/Quazmoz/InferBridge/releases" in _RELEASES_APIS[0]\n'
                  '    assert "/Quazmoz/openvino-windows-llm/releases" in _RELEASES_APIS[1]\n'
              )
          path.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Install, format, and commit tested source
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          ruff check . --fix
          ruff format .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: complete final InferBridge migration contracts"
            git push origin HEAD:rename/inferbridge
          }

      - name: Run lint and test gates
        shell: pwsh
        run: |
          $Out = "$env:RUNNER_TEMP\inferbridge-final"
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          ruff check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff lint failed" }
          ruff format --check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff format failed" }
          python scripts/release_tools.py verify-version-consistency --root . --version 0.7.0
          if ($LASTEXITCODE -ne 0) { throw "Version consistency failed" }
          python -m pytest 2>&1 | Tee-Object "$Out\full.txt"
          if ($LASTEXITCODE -ne 0) { throw "Full pytest failed" }
          python -m pytest tests/test_inferbridge_brand.py tests/test_inferbridge_paths.py tests/test_inferbridge_startup.py tests/test_inferbridge_update_compatibility.py tests/test_inferbridge_packaging_contract.py tests/test_inferbridge_release_repository.py tests/test_inferbridge_public_branding.py tests/test_inferbridge_runtime_hook_paths.py tests/test_release_pipeline.py tests/test_release_signing_gate.py tests/test_release_provenance.py tests/test_installer_upgrade_contract.py tests/test_runtime_hook_upgrade.py tests/test_update_checker.py tests/test_update_checker_resilience.py tests/test_release_models.py 2>&1 | Tee-Object "$Out\targeted.txt"
          if ($LASTEXITCODE -ne 0) { throw "Targeted pytest failed" }

      - name: Resolve Inno Setup
        shell: pwsh
        run: |
          $Candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $Iscc = $Candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $Iscc -and (Get-Command choco -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $Iscc = $Candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if ($Iscc) {
            "ISCC_PATH=$Iscc" | Out-File $env:GITHUB_ENV -Append
            "available" | Set-Content "$env:RUNNER_TEMP\inferbridge-final\inno.txt"
          } else {
            "unavailable; installer compilation skipped" | Set-Content "$env:RUNNER_TEMP\inferbridge-final\inno.txt"
          }

      - name: Build and scan unsigned Windows artifacts
        shell: pwsh
        run: |
          $Args = @{ Version="0.7.0"; Channel="stable"; Clean=$true; Unsigned=$true; SkipTests=$true; MockSmokeTest=$true }
          if ($env:ISCC_PATH) { $Args.IsccPath=$env:ISCC_PATH } else { $Args.SkipInstaller=$true }
          & .\scripts\build_release.ps1 @Args 2>&1 | Tee-Object "$env:RUNNER_TEMP\inferbridge-final\build.txt"
          if ($LASTEXITCODE -ne 0) { throw "Windows release build failed" }

      - name: Record results and remove bootstrap
        shell: pwsh
        run: |
          $Out = "$env:RUNNER_TEMP\inferbridge-final"
          $Full = (Get-Content "$Out\full.txt" | Select-Object -Last 5) -join "`n"
          $Targeted = (Get-Content "$Out\targeted.txt" | Select-Object -Last 5) -join "`n"
          $Build = (Get-Content "$Out\build.txt" | Select-Object -Last 25) -join "`n"
          $Inno = (Get-Content "$Out\inno.txt" -Raw).Trim()
          $Artifacts = (Get-ChildItem artifacts\release-0.7.0 -File | Sort-Object Name | ForEach-Object { "- ``$($_.Name)``: $($_.Length) bytes" }) -join "`n"
          New-Item -ItemType Directory -Force docs\validation | Out-Null
          @"
          # InferBridge branch validation

          - Repository: ``Quazmoz/InferBridge``
          - Branch: ``rename/inferbridge``
          - Validated commit: ``$((git rev-parse HEAD).Trim())``
          - Platform: GitHub-hosted ``windows-latest``
          - Python: 3.11
          - Inno Setup: $Inno
          - Signing: not performed; artifacts are explicitly unsigned
          - Real Intel hardware validation: not performed

          ## Full pytest
          ```text
          $Full
          ```

          ## Targeted pytest
          ```text
          $Targeted
          ```

          ## Release build tail
          ```text
          $Build
          ```

          ## Produced artifacts
          $Artifacts

          ## Remaining physical validation
          Upgrade from the latest published legacy installer, real shortcuts and Add or Remove Programs migration, startup-registry preservation, uninstall data choices, trusted Authenticode signing, Intel CPU/GPU/NPU/AUTO inference, and disposable-repository release redirect testing remain unverified.
          "@ | Set-Content docs\validation\inferbridge-branch-validation.md -Encoding utf8

          Remove-Item .github\scripts\finalize_inferbridge_core.py -ErrorAction SilentlyContinue
          Remove-Item .github\scripts\finalize_inferbridge_ui.py -ErrorAction SilentlyContinue
          Remove-Item .github\scripts\write_inferbridge_final_tests.py -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\inferbridge-public-branding-finalize.yml -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\inferbridge-finalize-retry.yml -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\inferbridge-post-rename-finalize.yml -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\inferbridge-final-gate.yml
          git add -A
          git commit -m "test: record final InferBridge Windows validation"
          git push origin HEAD:rename/inferbridge

# Retry after idempotency repair.
